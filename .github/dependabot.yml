version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "auto-merge"]
    open-pull-requests-limit: 5
    groups:
      npm-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # eslint-config-next bundles eslint-plugin-react which doesn't support ESLint 10 yet
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  # github-actions — ungrouped (SHA-pinned policy, each action reviewed individually)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "auto-merge"]
