version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      dependencies:
        patterns: ["*"]
    ignore:
      # eslint-config-next bundles eslint-plugin-react which doesn't support ESLint 10 yet
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
